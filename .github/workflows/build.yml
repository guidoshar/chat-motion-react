name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        react: ['18.3.1', '19.2.0']
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The lockfile is validated by npm ci. Override only React for the runtime
      # matrix without re-resolving this package's optional peer dependencies.
      - run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm test
      - run: npm run build:demo
      - run: npm run check:package
