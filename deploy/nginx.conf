# Include this server block from Nginx's http context (for example conf.d/).
# Change server_name for your hostname; this example serves the site at /.
server {
    listen 80;
    server_name _;
    root /var/www/chat-motion;
    index index.html;

    # Vite generates content-hashed assets. Missing assets should return 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep the entry document fresh after replacing a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Both / and /?view=chat load index.html; there are no server-side routes.
    location / {
        try_files $uri $uri/ =404;
    }
}
